services:
  agrosync:
    build: .
    container_name: agrosync-ai
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      - PORT=3080
      - HOST=0.0.0.0
      - TZ=Asia/Jakarta
    volumes:
      - ./data:/app/data

